<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイオリジナルAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <h1>マイAIアシスタント</h1>
        
        <!-- APIキー入力エリア (初回だけ表示されます) -->
        <div id="api-key-area" class="api-key-area">
            <p>最初にGemini APIキーを設定してください</p>
            <input type="password" id="api-key-input" placeholder="APIキーを貼り付け">
            <button id="save-key-btn">設定する</button>
            <p class="note">※キーはあなたのブラウザ内にのみ保存され、GitHub上には公開されません（安全です）</p>
        </div>

        <!-- チャットエリア (最初は隠れています) -->
        <div id="chat-area" style="display: none;">
            <div id="chat-box" class="chat-box"></div>
            <div class="input-area">
                <button id="mic-btn">🎤 音声</button>
                <input type="text" id="user-input" placeholder="メッセージを入力...">
                <button id="send-btn">送信</button>
            </div>
        </div>
    </div>
    
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
