<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOD DESIGN AI</title>
    <style>
        /* =========================================
           ベース設定 & タイポグラフィ
           ========================================= */
        :root {
            --bg-color: #f6f5f0;
            --main-text: #1a1a1a;
            --blue: #2f53d7;
            --yellow: #ffc900;
            --pink: #ff7b93;
            --green: #008b74;
            --border-width: 4px;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           背景の幾何学模様 (メンフィス・スタイル)
           ========================================= */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        /* ドット柄の四角 */
        .shape-dots {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 120px;
            height: 120px;
            background-image: radial-gradient(var(--main-text) 20%, transparent 20%);
            background-size: 15px 15px;
            transform: rotate(15deg);
        }
        /* 青い半円 */
        .shape-half-circle {
            position: absolute;
            bottom: 15%;
            left: 10%;
            width: 100px;
            height: 50px;
            background-color: var(--blue);
            border: var(--border-width) solid var(--main-text);
            border-radius: 50px 50px 0 0;
            transform: rotate(-20deg);
        }
        /* ピンクの丸 */
        .shape-circle {
            position: absolute;
            top: 20%;
            right: 15%;
            width: 80px;
            height: 80px;
            background-color: var(--pink);
            border: var(--border-width) solid var(--main-text);
            border-radius: 50%;
        }
        /* 黄色のジグザグ（波線代わり） */
        .shape-triangle {
            position: absolute;
            bottom: 25%;
            right: 8%;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 86.6px solid var(--yellow);
            filter: drop-shadow(0px 4px 0px var(--main-text));
        }
        /* 緑の図形 */
        .shape-green {
            position: absolute;
            top: 50%;
            left: -20px;
            width: 60px;
            height: 140px;
            background-color: var(--green);
            border: var(--border-width) solid var(--main-text);
            border-radius: 30px;
        }

        /* =========================================
           メインコンテナ (ネオ・ブルータリズム)
           ========================================= */
        .app-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background-color: #ffffff;
            border: var(--border-width) solid var(--main-text);
            box-shadow: 12px 12px 0px var(--main-text);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 span:nth-child(1) { color: var(--blue); }
        h1 span:nth-child(2) { color: var(--pink); }
        h1 span:nth-child(3) { color: var(--yellow); text-shadow: -1px -1px 0 #1a1a1a, 1px -1px 0 #1a1a1a, -1px 1px 0 #1a1a1a, 1px 1px 0 #1a1a1a;}

        /* =========================================
           APIキー入力画面
           ========================================= */
        #api-key-area {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .instruction {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .input-neo {
            padding: 15px;
            font-size: 1rem;
            border: 3px solid var(--main-text);
            border-radius: 8px;
            outline: none;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
        }
        .input-neo:focus {
            border-color: var(--blue);
        }
        .btn-neo {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--yellow);
            color: var(--main-text);
            border: 3px solid var(--main-text);
            border-radius: 8px;
            box-shadow: 6px 6px 0px var(--main-text);
            transition: all 0.1s ease;
        }
        .btn-neo:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--main-text);
        }
        .note {
            font-size: 0.8rem;
            color: #555;
            line-height: 1.5;
        }

        /* =========================================
           チャット画面
           ========================================= */
        #chat-area {
            display: none;
            flex-direction: column;
            height: 60vh;
            max-height: 600px;
        }
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            border: 3px solid var(--main-text);
            border-radius: 12px;
            padding: 15px;
            background-color: #fafafa;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* スクロールバーのデザイン */
        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: var(--main-text); border-radius: 4px; }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            line-height: 1.5;
            font-weight: 500;
            border: 2px solid var(--main-text);
            word-wrap: break-word;
        }
        .user-msg {
            align-self: flex-end;
            background-color: var(--yellow);
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            align-self: flex-start;
            background-color: #ffffff;
            border-bottom-left-radius: 4px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        .loading-msg {
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            background-color: #ffffff;
            border: 2px solid var(--main-text);
            padding: 10px 15px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--main-text);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area .input-neo {
            flex-grow: 1;
        }
        .btn-send {
            background-color: var(--blue);
            color: white;
            padding: 0 20px;
        }
        .btn-mic {
            background-color: var(--pink);
            color: var(--main-text);
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-mic.listening {
            background-color: var(--green);
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 6px 6px 0px var(--main-text); }
            50% { transform: scale(0.95); box-shadow: 3px 3px 0px var(--main-text); }
            100% { transform: scale(1); box-shadow: 6px 6px 0px var(--main-text); }
        }
        
        /* スマホ対応 */
        @media (max-width: 600px) {
            .app-container {
                width: 95%;
                padding: 15px;
                box-shadow: 8px 8px 0px var(--main-text);
            }
            .bg-shapes {
                display: none; /* 画面が小さい時は背景図形を隠す */
            }
        }
    </style>
</head>
<body>

    <!-- 背景の幾何学模様 -->
    <div class="bg-shapes">
        <div class="shape-dots"></div>
        <div class="shape-half-circle"></div>
        <div class="shape-circle"></div>
        <div class="shape-triangle"></div>
        <div class="shape-green"></div>
    </div>

    <!-- メインコンテナ -->
    <div class="app-container">
        <h1><span>M</span>Y <span>A</span>I</h1>
        
        <!-- APIキー入力エリア -->
        <div id="api-key-area">
            <p class="instruction">Gemini APIキーを設定してください</p>
            <input type="password" id="api-key-input" class="input-neo" placeholder="AIzaSy...">
            <button id="save-key-btn" class="btn-neo">START 🚀</button>
            <p class="note">※キーはあなたのブラウザ内にのみ保存され、外部には公開されません。</p>
        </div>

        <!-- チャットエリア -->
        <div id="chat-area">
            <div id="chat-box" class="chat-box">
                <!-- 初期メッセージ -->
                <div class="message ai-msg">こんにちは！準備完了です。何でも聞いてください。</div>
            </div>
            
            <div class="input-area">
                <button id="mic-btn" class="btn-neo btn-mic" title="音声入力">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                </button>
                <input type="text" id="user-input" class="input-neo" placeholder="メッセージを入力...">
                <button id="send-btn" class="btn-neo btn-send">送信</button>
            </div>
        </div>
    </div>

    <script>
        // DOMの読み込みが完了してからJavaScriptを実行する（確実な動作のため）
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 要素の取得 ---
            const apiKeyArea = document.getElementById('api-key-area');
            const chatArea = document.getElementById('chat-area');
            const apiKeyInput = document.getElementById('api-key-input');
            const saveKeyBtn = document.getElementById('save-key-btn');
            const chatBox = document.getElementById('chat-box');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const micBtn = document.getElementById('mic-btn');

            let currentApiKey = '';

            // --- 1. APIキーの設定処理 ---
            const savedKey = localStorage.getItem('my_gemini_api_key_v2');
            if (savedKey) {
                currentApiKey = savedKey;
                showChatArea();
            }

            saveKeyBtn.addEventListener('click', () => {
                const key = apiKeyInput.value.trim();
                if (key) {
                    localStorage.setItem('my_gemini_api_key_v2', key);
                    currentApiKey = key;
                    showChatArea();
                } else {
                    alert('APIキーを入力してください。');
                }
            });

            function showChatArea() {
                apiKeyArea.style.display = 'none';
                chatArea.style.display = 'flex'; // flexにしてレイアウト維持
            }

            // --- 2. 音声入力の設定 (Web Speech API) ---
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = false;

                micBtn.addEventListener('click', () => {
                    recognition.start();
                    micBtn.classList.add('listening');
                });

                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    userInput.value = transcript;
                    micBtn.classList.remove('listening');
                };
                
                recognition.onerror = (event) => {
                    console.error('音声認識エラー:', event.error);
                    micBtn.classList.remove('listening');
                };
                
                recognition.onend = () => {
                    micBtn.classList.remove('listening');
                };
            } else {
                // ブラウザが音声入力非対応の場合はボタンを隠す
                micBtn.style.display = 'none';
            }

            // --- 3. AIとの通信 (確実な fetch API を使用) ---
            async function generateAIResponse(text) {
                // Gemini APIのエンドポイントURL (最新の2.5-flashモデル)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${currentApiKey}`;

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: text }]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'APIリクエストに失敗しました');
                    }

                    const data = await response.json();
                    // レスポンスからテキストを抽出
                    return data.candidates[0].content.parts[0].text;

                } catch (error) {
                    console.error('通信エラー:', error);
                    // キーが無効な場合などはリセット
                    if (error.message.includes('API_KEY_INVALID') || error.message.includes('400')) {
                        localStorage.removeItem('my_gemini_api_key_v2');
                        apiKeyArea.style.display = 'flex';
                        chatArea.style.display = 'none';
                        return "【エラー】APIキーが間違っているか、無効です。ページをリロードして再設定してください。";
                    }
                    return "【エラー】通信に失敗しました。時間をおいて再度お試しください。";
                }
            }

            // 画面にメッセージを表示
            function addMessageToChat(text, sender) {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
                msgDiv.textContent = text;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 考え中アニメーションの追加
            function showLoading() {
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'loading-indicator';
                loadingDiv.classList.add('loading-msg');
                loadingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
                chatBox.appendChild(loadingDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 考え中アニメーションの削除
            function hideLoading() {
                const loadingDiv = document.getElementById('loading-indicator');
                if (loadingDiv) {
                    loadingDiv.remove();
                }
            }

            // 送信ボタンの処理
            sendBtn.addEventListener('click', async () => {
                const text = userInput.value.trim();
                if (!text) return;

                // ユーザーのメッセージを表示
                addMessageToChat(text, 'user');
                userInput.value = '';

                // ローディング表示
                showLoading();

                // AIから回答を取得
                const aiResponseText = await generateAIResponse(text);

                // ローディングを消して回答を表示
                hideLoading();
                addMessageToChat(aiResponseText, 'ai');
            });

            // Enterキーでも送信できるようにする
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });
        });
    </script>
</body>
</html>
